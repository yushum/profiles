rules:
  # ---------------------------------------------------------------------------
  # Domain and non-IP rules. Keep this entire block above every IP rule.
  # ---------------------------------------------------------------------------
  - RULE-SET,reject_non_ip_drop,REJECT-DROP
  - RULE-SET,reject_domainset,REJECT
  - RULE-SET,reject_non_ip,REJECT
  - RULE-SET,reject_non_ip_no_drop,REJECT

  # Blocks Sogou Input telemetry; may affect account sync and dictionary updates.
  - RULE-SET,sogouinput,REJECT

  - RULE-SET,speedtest,Speedtest
  - RULE-SET,cdn_domainset,CDN
  - RULE-SET,cdn_non_ip,CDN

  # One policy for every streaming service; no regional splitting.
  - RULE-SET,stream_non_ip,Streaming

  - RULE-SET,ai_non_ip,AI
  - RULE-SET,apple_intelligence_non_ip,AI
  - RULE-SET,telegram_non_ip,Telegram

  - RULE-SET,apple_cdn,DIRECT
  - RULE-SET,apple_services,Apple
  - RULE-SET,apple_cn_non_ip,DIRECT
  - RULE-SET,microsoft_cdn_non_ip,DIRECT
  - RULE-SET,microsoft_non_ip,Microsoft

  - RULE-SET,neteasemusic_non_ip,NetEase Music
  - RULE-SET,download_domainset,Download
  - RULE-SET,download_non_ip,Download

  - RULE-SET,lan_non_ip,DIRECT
  - RULE-SET,domestic_non_ip,DIRECT
  - RULE-SET,direct_non_ip,DIRECT
  - RULE-SET,global_non_ip,Proxy Select

  # ---------------------------------------------------------------------------
  # IP rules. Keep this entire block below the domain/non-IP rules.
  # ---------------------------------------------------------------------------
  - RULE-SET,reject_ip,REJECT
  - RULE-SET,stream_ip,Streaming
  - RULE-SET,ai_ip,AI
  - RULE-SET,telegram_ip,Telegram
  - RULE-SET,neteasemusic_ip,NetEase Music
  - RULE-SET,lan_ip,DIRECT
  - RULE-SET,domestic_ip,DIRECT
  - RULE-SET,china_ip,DIRECT

  - MATCH,Proxy Select
