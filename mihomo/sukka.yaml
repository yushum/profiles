# SPDX-License-Identifier: AGPL-3.0-only
# Sukka Ruleset for Mihomo / Clash Verge Rev
# Community adaptation, not an official SukkaW/Surge deliverable.
# Upstream: https://github.com/SukkaW/Surge
# Rule server: https://ruleset.skk.moe
#
# Before importing, replace the proxy-provider URL below with your own
# subscription URL. Do not publish a configuration containing that private URL.

mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false
find-process-mode: strict

# Clash Verge Rev manages its own external controller and TUN state, so this
# profile intentionally does not override either setting.
profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.home.arpa"
    - "localhost"
    - "localhost.*"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.windows.com"
    - "time.apple.com"
    - "+.pool.ntp.org"
    - "+.ntp.org"
    - "stun.*.*"
    - "stun.*.*.*"
    - "music.163.com"
    - "+.music.163.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  direct-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

proxy-providers:
  "Subscription":
    type: http
    # Replace the next URL locally. Subscription URLs are private credentials.
    url: "https://example.com/REPLACE_WITH_YOUR_SUBSCRIPTION_URL"
    path: ./providers/my-subscription.yaml
    interval: 21600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600
      timeout: 5000
      lazy: true
      expected-status: 204

proxy-groups:
  # No region filtering: this group contains every node from the subscription.
  - name: "Proxy Select"
    type: select
    use:
      - "Subscription"

  - name: "AI"
    type: select
    proxies:
      - "Proxy Select"
    use:
      - "Subscription"

  - name: "Telegram"
    type: select
    proxies:
      - "Proxy Select"
    use:
      - "Subscription"

  - name: "Streaming"
    type: select
    proxies:
      - "Proxy Select"
    use:
      - "Subscription"

  - name: "CDN"
    type: select
    proxies:
      - "Proxy Select"
      - DIRECT
    use:
      - "Subscription"

  - name: "Speedtest"
    type: select
    proxies:
      - DIRECT
      - "Proxy Select"
    use:
      - "Subscription"

  - name: "Apple"
    type: select
    proxies:
      - DIRECT
      - "Proxy Select"
    use:
      - "Subscription"

  - name: "Microsoft"
    type: select
    proxies:
      - DIRECT
      - "Proxy Select"
    use:
      - "Subscription"

  - name: "NetEase Music"
    type: select
    proxies:
      - DIRECT
      - "Proxy Select"
    use:
      - "Subscription"

  - name: "Download"
    type: select
    proxies:
      - DIRECT
      - "Proxy Select"
    use:
      - "Subscription"

