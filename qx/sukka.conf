# Sukka Ruleset for Quantumult X
# Community adaptation, not an official SukkaW/Surge deliverable.
# Upstream: https://github.com/SukkaW/Surge
# Rule server: https://ruleset.skk.moe
#
# Verified against the Quantumult X v1.8.0 (build 943) TestFlight sample
# configuration (sample.conf). The built-in FILTER_LAN / FILTER_REGION filter
# snippets used below require Quantumult X 1.8.0 or newer.
#
# Unlike the other profiles in this repository, Quantumult X cannot parse
# Surge syntax, so the rule files under qx/Rules/ are pre-converted lists
# maintained by .github/workflows/sukka-qx.yml (tools/sukka-qx.mjs).
#
# Conversion omissions (reported per file in each list header):
#   - Quantumult X has no REJECT-NO-DROP; upstream reject-no-drop maps to reject.
#   - URL-REGEX, USER-AGENT, PROCESS-NAME, AND/OR/NOT logic rules are dropped
#     (no Quantumult X filter equivalent; ~130 lines upstream).
#   - reject_extra / reject_phishing domain sets are not offered: ~213k more
#     lines would be unsafe on Quantumult X. Use dedicated content blockers.
#   - ip/china_ip and ip/lan are replaced by built-in FILTER_REGION / FILTER_LAN.
#   - Dot-prefixed DOMAIN-SET lines (subdomain-only match in Surge) are
#     approximated as host-suffix, which also matches the bare domain.
#
# IMPORTANT: keep every domain/non-IP list above every IP list below.
# Reordering can trigger local DNS resolution before proxy-domain matching.

[general]
server_check_url = http://www.google.com/generate_204
# IP information provider and custom parser for the node status bar.
# Uses ipwho.is (MaxMind GeoIP2) with native Chinese localization.
# Set to "disabled" to hide the node IP info entirely.
geo_location_checker = http://ipwho.is/?lang=zh-CN, https://raw.githubusercontent.com/yushum/profiles/master/qx/Scripts/ipwhois.js
# Domains that must bypass the placeholder-IP (198.18.0.0/15) mapping mechanism.
dns_exclusion_list = *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me
# Drop QUIC/STUN at the UDP layer so HTTP/3 traffic falls back to TCP, which
# most proxy protocols handle more efficiently. Mirrors the Stash profile.
udp_drop_list = STUN, QUIC
# Servers without UDP relay: reject instead of silently proxying.
fallback_udp_policy = reject

# When doh-server is set, Quantumult X ignores plain and system DNS servers.
# IPv6 is intentionally off, mirroring the Shadowrocket profile.
[dns]
no-ipv6
doh-server = https://doh.pub/dns-query, https://dns.alidns.com/dns-query

# PROXY is the built-in policy: it follows the node selected on the Quantumult X
# home screen. This profile does not contain or download a node subscription.
[policy]
static = AI, PROXY, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/AI.png
static = Telegram, PROXY, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram.png
static = Streaming, PROXY, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Streaming.png
static = CDN, PROXY, DIRECT, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Cloudflare.png
static = Speedtest, PROXY, DIRECT, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Speedtest.png
static = Apple, PROXY, DIRECT, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple.png
static = Microsoft, PROXY, DIRECT, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Microsoft.png
static = NetEase Music, DIRECT, PROXY, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Netease_Music.png
static = Download, PROXY, DIRECT, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Download.png

# Add nodes or subscriptions in Quantumult X; do not paste credentials here.
[server_remote]

# Each generated rule carries a policy as required by Quantumult X's native
# three-field filter format. It matches the force-policy below; force-policy
# takes precedence when both exist. Keep the list order identical to the
# Shadowrocket profile: all non-IP lists above all IP lists.
# update-interval=86400 lets the client refresh daily; the lists themselves are
# rebuilt hourly against upstream.
# inserted-resource=true on every entry makes all remote rules match before any
# filter_local rules. Without it, filter_local > filter_remote > final, meaning
# any hand-added local rule would silently override the curated remote lists.
# If raw.githubusercontent.com is unreachable, swap the host to
# https://cdn.jsdelivr.net/gh/yushum/profiles@master/qx/Rules/<name>.list
[filter_remote]
# ---- Ad / privacy / malware blocking (REJECT) ----
https://raw.githubusercontent.com/yushum/profiles/master/qx/Rules/reject-drop.list, tag=Ad Reject Drop, force-policy=reject, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true
# ~135k host-suffix lines. Heavy but supported; disable this line on old devices.
https://raw.githubusercontent.com/yushum/profiles/master/qx/Rules/reject-domainset.list, tag=Ad Reject Base, force-policy=reject, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true
https://raw.githubusercontent.com/yushum/profiles/master/qx/Rules/reject.list, tag=Ad Reject, force-policy=reject, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true
https://raw.githubusercontent.com/yushum/profiles/master/qx/Rules/reject-no-drop.list, tag=Ad Reject No-Drop, force-policy=reject, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true
# Blocks Sogou Input telemetry; may affect account sync and dictionary updates.
https://raw.githubusercontent.com/yushum/profiles/master/qx/Rules/sogouinput.list, tag=Sogou Input, force-policy=reject, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true

# ---- Speedtest / static CDN ----
https://raw.githubusercontent.com/yushum/profiles/master/qx/Rules/speedtest.list, tag=Speedtest, force-policy=Speedtest, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true
https://raw.githubusercontent.com/yushum/profiles/master/qx/Rules/cdn-domainset.list, tag=CDN Domains, force-policy=CDN, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true
https://raw.githubusercontent.com/yushum/profiles/master/qx/Rules/cdn.list, tag=CDN, force-policy=CDN, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true

# ---- Streaming ----
https://raw.githubusercontent.com/yushum/profiles/master/qx/Rules/stream.list, tag=Streaming, force-policy=Streaming, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true

# ---- AI / Telegram ----
https://raw.githubusercontent.com/yushum/profiles/master/qx/Rules/ai.list, tag=AI, force-policy=AI, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true
https://raw.githubusercontent.com/yushum/profiles/master/qx/Rules/apple-intelligence.list, tag=Apple Intelligence, force-policy=AI, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true
https://raw.githubusercontent.com/yushum/profiles/master/qx/Rules/telegram.list, tag=Telegram, force-policy=Telegram, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true

# ---- Apple / Microsoft ----
https://raw.githubusercontent.com/yushum/profiles/master/qx/Rules/apple-cdn-domainset.list, tag=Apple CDN Direct, force-policy=direct, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true
https://raw.githubusercontent.com/yushum/profiles/master/qx/Rules/apple-services.list, tag=Apple, force-policy=Apple, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true
https://raw.githubusercontent.com/yushum/profiles/master/qx/Rules/apple-cn.list, tag=Apple CN Direct, force-policy=direct, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true
https://raw.githubusercontent.com/yushum/profiles/master/qx/Rules/microsoft-cdn.list, tag=Microsoft CDN Direct, force-policy=direct, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true
https://raw.githubusercontent.com/yushum/profiles/master/qx/Rules/microsoft.list, tag=Microsoft, force-policy=Microsoft, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true

# ---- NetEase Music / large downloads ----
https://raw.githubusercontent.com/yushum/profiles/master/qx/Rules/neteasemusic.list, tag=NetEase Music, force-policy=NetEase Music, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true
https://raw.githubusercontent.com/yushum/profiles/master/qx/Rules/download-domainset.list, tag=Download Domains, force-policy=Download, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true
https://raw.githubusercontent.com/yushum/profiles/master/qx/Rules/download.list, tag=Download, force-policy=Download, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true

# ---- Domestic / direct / global ----
https://raw.githubusercontent.com/yushum/profiles/master/qx/Rules/lan.list, tag=LAN Domains, force-policy=direct, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true
https://raw.githubusercontent.com/yushum/profiles/master/qx/Rules/domestic.list, tag=Domestic, force-policy=direct, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true
https://raw.githubusercontent.com/yushum/profiles/master/qx/Rules/direct.list, tag=Direct, force-policy=direct, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true
https://raw.githubusercontent.com/yushum/profiles/master/qx/Rules/global.list, tag=Global Proxy, force-policy=proxy, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true

# ---- IP rules. Keep this entire block below every list above. ----
https://raw.githubusercontent.com/yushum/profiles/master/qx/Rules/ip-reject.list, tag=Ad Reject IP, force-policy=reject, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true
https://raw.githubusercontent.com/yushum/profiles/master/qx/Rules/ip-stream.list, tag=Streaming IP, force-policy=Streaming, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true
https://raw.githubusercontent.com/yushum/profiles/master/qx/Rules/ip-ai.list, tag=AI IP, force-policy=AI, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true
https://raw.githubusercontent.com/yushum/profiles/master/qx/Rules/ip-telegram.list, tag=Telegram IP, force-policy=Telegram, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true
https://raw.githubusercontent.com/yushum/profiles/master/qx/Rules/ip-neteasemusic.list, tag=NetEase Music IP, force-policy=NetEase Music, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true
https://raw.githubusercontent.com/yushum/profiles/master/qx/Rules/ip-domestic.list, tag=Domestic IP, force-policy=direct, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true

# Built-in snippets (Quantumult X 1.8.0+): LAN ranges, then GeoIP CN. They
# replace upstream ip/lan.conf and ip/china_ip.conf.
FILTER_LAN, tag=LAN, force-policy=direct, inserted-resource=true, enabled=true
FILTER_REGION, tag=CN, force-policy=direct, inserted-resource=true, enabled=true

# Rewrite subscriptions are managed in the app (Settings → Rewrite → Subscribe).
# The importer requires this section to be present.
[rewrite_remote]

# Local nodes would live here. This profile only uses nodes or subscriptions
# added in the app; the importer requires this section to be present.
[server_local]

[filter_local]
final, proxy

# Local rewrite rules are managed in the app (Settings → Rewrite → Local Edit).
[rewrite_local]

# MITM is unused by this profile; enable it in the app only if you add your own
# rewrite rules that need TLS interception.
[mitm]
;passphrase =
;p12 =
