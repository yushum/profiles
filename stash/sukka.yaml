# Sukka Ruleset for Stash (iOS / macOS / tvOS / visionOS)
# Community adaptation, not an official SukkaW/Surge deliverable.
# Upstream: https://github.com/SukkaW/Surge
# Rule server: https://ruleset.skk.moe
#
# Before importing, replace the proxy-provider URL below with your own
# subscription URL. Do not publish a configuration containing that private URL.
#
# Stash uses Fake IP by default; fake-ip-filter lists domains that must
# resolve to their real addresses. On mobile devices 1–2 DNS servers are
# recommended to conserve battery and memory.

mode: rule
log-level: warning
ipv6: false

dns:
  # Bootstrap DNS: resolves hostnames of other DNS servers.
  # Must use IP addresses (except for "system").
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  # Resolve proxy server domain names independently to prevent recursion.
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  # Domains that must resolve to real IPs instead of Fake IPs.
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.home.arpa"
    - "localhost"
    - "localhost.*"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.windows.com"
    - "time.apple.com"
    - "+.pool.ntp.org"
    - "+.ntp.org"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.stun.*.*.*.*"
    - "+.stun.*.*.*.*.*"
    - "lens.l.google.com"
    - "*.n.n.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "xbox.*.*.microsoft.com"
    - "*.*.xboxlive.com"
    - "*.mcdn.bilivideo.cn"
    - "music.163.com"
    - "+.music.163.com"

# Disable QUIC so traffic is forwarded over TCP, which proxies handle better.
script:
  shortcuts:
    quic: network == 'udp' and dst_port == 443

proxy-providers:
  "Subscription":
    # Replace the next URL locally. Subscription URLs are private credentials.
    url: "https://example.com/REPLACE_WITH_YOUR_SUBSCRIPTION_URL"
    path: ./providers/my-subscription.yaml
    interval: 21600

proxy-groups:
  # No region filtering: this group contains every node from the subscription.
  - name: "PROXY"
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png
    type: select
    use:
      - "Subscription"

  - name: "AI"
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/AI.png
    type: select
    proxies:
      - "PROXY"
    use:
      - "Subscription"

  - name: "Telegram"
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram.png
    type: select
    proxies:
      - "PROXY"
    use:
      - "Subscription"

  - name: "Streaming"
